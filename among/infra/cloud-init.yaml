#cloud-config
# Prepara a máquina na primeira vez que ela liga. O jogo em si NÃO vem aqui: ele sobe depois pelo
# deploy.ps1, e é isso que permite publicar uma versão nova sem recriar a VM.

package_update: true
packages:
  - unzip

users:
  - default
  # Usuário só do jogo, sem shell e sem senha: se um dia alguém achar um jeito de fazer o servidor
  # executar coisa que não devia, essa coisa roda sem poder nenhum na máquina.
  - name: amongus
    system: true
    shell: /usr/sbin/nologin

write_files:
  - path: /etc/systemd/system/amongus.service
    content: |
      [Unit]
      Description=Among Us Audiogame - servidor dedicado
      After=network-online.target
      Wants=network-online.target

      [Service]
      Type=simple
      User=amongus
      WorkingDirectory=/opt/amongus
      ExecStart=/opt/amongus/server_main
      # O binário do NVGT carrega as bibliotecas dele de ./lib, e o Linux não procura ali sozinho.
      # Sem esta linha o serviço morre no start sem explicação decente.
      Environment=LD_LIBRARY_PATH=/opt/amongus/lib
      # O servidor cai? Volta em 10 segundos. Uma partida se perde, o serviço não.
      Restart=always
      RestartSec=10
      # Enquanto o binário ainda não subiu, o serviço fica tentando - e sobe sozinho no minuto em que
      # o primeiro deploy chegar, sem ninguém precisar entrar na máquina.
      StandardOutput=journal
      StandardError=journal

      [Install]
      WantedBy=multi-user.target

runcmd:
  # /opt/amongus é de quem administra (pra conseguir subir arquivo por SSH) e o serviço só precisa
  # ler - exceto o banco de contas, que ele escreve, e por isso o dono do diretório é ele.
  - mkdir -p /opt/amongus
  - chown -R amongus:amongus /opt/amongus
  - usermod -aG amongus ${admin_username}
  - chmod 775 /opt/amongus
  - systemctl daemon-reload
  - systemctl enable --now amongus.service
